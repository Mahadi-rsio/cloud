app = "cloud-builder"
primary_region = "lax"
kill_signal = "SIGTERM"

[build]
  dockerfile = "builder/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ENABLE_BUILDKITD = "1"
  BUILD_WORKSPACE_DIR = "/home/builder/builds"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  # BuildKit needs ~4 GB; 2 vCPU shared.
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[experimental]
  auto_rollback = true