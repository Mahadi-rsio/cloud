app = "cloud-builder"
primary_region = "lax"
kill_signal = "SIGTERM"

[build]
  dockerfile = "builder/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ENABLE_BUILDKITD = "1"
  BUILD_WORKSPACE_DIR = "/home/builder/builds"
  # Runtimes are baked into this image (builder/railpack/Dockerfile); BuildKit
  # stays stateless (no volume). Base images are re-pulled on boot; the baked
  # runtimes make the slowest part (toolchain installs) instant.
  RAILPACK_BUILDER_IMAGE = "registry.fly.io/cloud-builder:railpack-builder-mise-2026.10.14"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  # Layer compression and installs are CPU-bound; 4 vCPU roughly halves the
  # cold-build time versus 2.
  memory = "8gb"
  cpu_kind = "shared"
  cpus = 4

[experimental]
  auto_rollback = true