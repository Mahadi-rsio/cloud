# fly.toml app configuration file for libSQL (sqld) in multi-tenant mode
# Documentation: https://fly.io/docs/reference/configuration/
# libSQL Server: https://github.com/tursodatabase/libsql

app = "libsql-database-service"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  image = "ghcr.io/tursodatabase/libsql-server:latest"

[processes]
  app = "/bin/sqld --enable-namespaces --db-path /var/lib/sqld/data.sqld"

[env]
  SQLD_NODE = "primary"
  SQLD_HTTP_LISTEN_ADDR = "0.0.0.0:8080"
  SQLD_ADMIN_LISTEN_ADDR = "0.0.0.0:8082"
  SQLD_DB_PATH = "/var/lib/sqld/data.sqld"
  SQLD_MAX_ACTIVE_NAMESPACES = "100"
  SQLD_MAX_RESPONSE_SIZE = "10MB"
  SQLD_MAX_TOTAL_RESPONSE_SIZE = "32MB"

[[mounts]]
  source = "sqld_data"
  destination = "/var/lib/sqld"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "GET"
    timeout = "2s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
